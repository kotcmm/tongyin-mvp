# 第二次统一格式化：覆盖新的 core/views/actions 模块，随后删除一次性工作流。
name: One-time refactor formatting
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/refactor-format.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Format all Go sources with gofmt
        run: gofmt -w backend/*.go
      - name: Format first-party JS / HTML / CSS
        run: |
          npx --yes prettier@3.6.2 --write "backend/webadmin/**/*.{html,css,js}" "miniprogram/pages/**/*.js" "miniprogram/utils/*.js" "miniprogram/app.js"
      - name: Commit formatting only
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/*.go backend/webadmin miniprogram/app.js miniprogram/pages miniprogram/utils
          if ! git diff --cached --quiet; then
            git commit -m "style: gofmt 和 Prettier 统一后端与小程序代码格式"
            git push origin HEAD:main
          fi
