name: One-time branch cleanup
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/branch-cleanup-once.yml'
permissions:
  contents: write
jobs:
  remove-obsolete-branches:
    runs-on: ubuntu-latest
    steps:
      - name: Delete verified obsolete refs (never main)
        uses: actions/github-script@v7
        with:
          script: |
            const expected = new Map([["feat/ai-providers-prompts","d093c823e315dda366737bc1fc34151952c42275"],["feat/dotnet-backend-migration","04db5ffb07beef4a24bfd6e65c6b933ef2866dca"],["feat/dotnet-clean-architecture","6bf5f2e2e96f1f08bc4eddb4166b1bbe59bc2aab"],["feat/dotnet-clean-architecture-v2","3e6f876848284540b84dac81413dcc5339dd798a"],["feat/dotnet-clean-skeleton","7fed5af24a757773baf748e1338a31a371f2b775"],["fix/seedream-image400","69f8d3971c04820d7c4ad3de68cecc9c498d6b51"],["fix/seedream-transport-diagnostics","840f02bb50c296c54ba29d722c8f0980f781287f"]]);
            const {owner, repo} = context.repo;
            const main = await github.rest.repos.getBranch({owner, repo, branch: "main"});
            if (main.data.commit.sha !== context.sha) {
              throw new Error("main HEAD changed; aborting destructive cleanup");
            }
            for (const [branch, expectedSha] of expected) {
              if (branch === "main") throw new Error("Refusing to delete main");
              const {data} = await github.rest.repos.getBranch({owner, repo, branch});
              if (data.commit.sha !== expectedSha) {
                throw new Error("Branch " + branch + " changed after verification; refusing deletion");
              }
              await github.rest.git.deleteRef({owner, repo, ref: "heads/" + branch});
              core.info("Deleted " + branch);
            }
            core.info("All 7 obsolete branches removed; main preserved.");
