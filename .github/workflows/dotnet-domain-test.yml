name: .NET backend tests

on:
  push:
    paths:
      - "backend-dotnet/**"
      - ".github/workflows/dotnet-domain-test.yml"
  pull_request:
    paths:
      - "backend-dotnet/**"
      - ".github/workflows/dotnet-domain-test.yml"
  workflow_dispatch:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Verify Domain, Application and Infrastructure tests
        run: dotnet test backend-dotnet/Tongyin.slnx -c Release
