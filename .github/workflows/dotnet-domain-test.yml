name: .NET backend tests

on:
  push:
    paths:
      - "backend-dotnet/**"
      - "scripts/check-admin-tasks.cjs"
      - ".github/workflows/dotnet-domain-test.yml"
  pull_request:
    paths:
      - "backend-dotnet/**"
      - ".github/workflows/dotnet-domain-test.yml"
  workflow_dispatch:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check admin console JavaScript syntax
        run: node --check backend-dotnet/src/Tongyin.Api/wwwroot/admin/orders.js
      - name: Verify admin tabs and task table behavior
        run: node scripts/check-admin-tasks.cjs
      - name: Run complete .NET solution tests
        run: dotnet test backend-dotnet/Tongyin.slnx -c Release -p:NuGetAudit=true -p:WarningsAsErrors=NU1903
