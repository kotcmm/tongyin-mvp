name: One-time AI branch gofmt
on:
  push:
    branches: [feat/ai-providers-prompts]
permissions:
  contents: write
jobs:
  format:
    if: "!contains(github.event.head_commit.message, '[skip format]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ai-providers-prompts
          persist-credentials: true
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
      - name: gofmt and commit
        shell: bash
        run: |
          gofmt -w backend/ai.go backend/ai_dispatch.go backend/ai_settings.go backend/ai_settings_test.go backend/model.go backend/sqlstore.go backend/main.go backend/work_handlers.go
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/
          if ! git diff --cached --quiet; then
            git commit -m "style: gofmt AI feature files [skip format]"
            git push origin HEAD:feat/ai-providers-prompts
          fi
