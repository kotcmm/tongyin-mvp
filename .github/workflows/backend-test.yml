name: Go backend checks
on:
  push:
    branches: [main]
  pull_request:
jobs:
  go-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Test Go backend
        working-directory: backend
        run: go test ./...
      - name: Check mini-program 3D scripts
        run: |
          node --check miniprogram/pages/preview/index.js
          node --check miniprogram/vendor/threejs-miniprogram/index.js
          node --check miniprogram/vendor/threejs-miniprogram/gltf-loader.js
          node scripts/check-miniapp-3d.cjs
          node --check miniprogram/pages/home/index.js
          node --check miniprogram/pages/works/index.js
          node --check miniprogram/utils/identity.js
          node scripts/check-miniapp-identity.cjs
          node --check miniprogram/pages/order/index.js
          node scripts/check-order-flow.cjs
          node scripts/check-operations.cjs
          node scripts/check-admin-search.cjs
      - name: Verify LAN/phone config generation
        run: node scripts/check-dev-phone.cjs
      - name: Parse phone dev script (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'scripts/dev.ps1'), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { throw ($errors | Out-String) }
