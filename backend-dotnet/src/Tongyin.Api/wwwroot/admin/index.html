<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>童印 · 订单履约管理</title>
  <link rel="stylesheet" href="/admin/app.css">
</head>
<body>
  <div id="loginWrap">
    <form id="loginForm" class="login" autocomplete="off">
      <div class="logo">童</div>
      <h1>童印运营中心</h1>
      <p class="muted">订单制作与发货管理（.NET 版）</p>
      <label for="adminToken">后台管理令牌</label>
      <input id="adminToken" type="password" required autocomplete="off" placeholder="请输入服务器配置的 ADMIN_TOKEN">
      <button type="submit" id="loginSubmit">进入运营后台</button>
      <p id="loginError" class="small" role="alert"></p>
      <div class="note small">此阶段使用 .NET 的 ADMIN_TOKEN 认证；管理员账号与角色登录尚未迁移。令牌只保存在本页面内存，刷新或退出后需重新输入。请通过 HTTPS 使用后台。</div>
    </form>
  </div>

  <div id="app" class="hidden">
    <aside>
      <div class="brand"><strong>童印<span style="color:#e58160">.</span></strong><small>订单履约管理</small></div>
      <nav aria-label="运营功能导航">
        <button type="button" class="nav-item active" data-tab="orders"><span class="glyph">▤</span>全部订单</button>
        <button type="button" class="nav-item" data-tab="shipping"><span class="glyph">◇</span>物流发货</button>
      </nav>
      <div class="account">
        <div>管理员令牌会话</div>
        <div class="row" style="margin-top:12px"><button id="logout" type="button" class="ghost">退出登录</button></div>
      </div>
    </aside>
    <section class="content">
      <div class="topline">
        <div>
          <h1 id="pageTitle">全部订单</h1>
          <p id="pageIntro">收款后制作 → 核实运单 → 发货</p>
        </div>
        <div class="row"><button id="refresh" type="button" class="ghost">刷新当前数据 ↻</button><span id="lastLoaded" class="small muted"></span></div>
      </div>
      <div class="panel">
        <div class="toolbar">
          <label class="sr-only" for="keyword">搜索订单</label>
          <input id="keyword" type="search" placeholder="订单编号、作品、收件人、快递单号">
          <label class="sr-only" for="statusFilter">订单状态</label>
          <select id="statusFilter">
            <option value="">全部状态</option>
            <option value="awaiting_payment">待付款</option>
            <option value="paid">已支付</option>
            <option value="printing">制作中</option>
            <option value="shipped">已发货</option>
            <option value="completed">已完成</option>
            <option value="canceled">已取消</option>
          </select>
        </div>
        <p id="pageMessage" class="small muted" role="status"></p>
        <div id="listResults" aria-live="polite"></div>
        <div class="pager">
          <span id="pagerText" class="small muted"></span>
          <button id="previous" type="button" class="ghost">上一页</button>
          <button id="next" type="button" class="ghost">下一页</button>
        </div>
      </div>
    </section>
  </div>
  <div id="modalContainer"></div>
  <div id="toast" class="toast hidden" role="status"></div>
  <script src="/admin/orders.js" defer></script>
</body>
</html>
