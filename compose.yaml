services:
  tongyin:
    build: .
    restart: unless-stopped
    env_file:
      - backend/.env
    environment:
      DATA_DIR: /data
      ADMIN_DIR: /app/admin
      LISTEN_ADDR: ':8080'
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - '127.0.0.1:18080:8080'
    volumes:
      - './runtime-data:/data'
      - './secrets:/secrets:ro'
