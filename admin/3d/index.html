<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>童印 · 3D预览</title>
<style>
*{box-sizing:border-box}html,body{height:100%;margin:0}body{font-family:-apple-system,BlinkMacSystemFont,"Microsoft YaHei",sans-serif;background:#F5F6F2;color:#35453B}
.shell{height:100dvh;display:flex;flex-direction:column;max-width:900px;margin:auto;padding:15px 15px max(16px,env(safe-area-inset-bottom))}
.header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:7px 5px 16px}.header strong{font-size:18px}.header span{font-size:12px;color:#76927B;background:#E5EEE5;padding:8px 10px;border-radius:30px}
.stage{position:relative;flex:1;min-height:200px;border-radius:24px;overflow:hidden;background:#EBF0EA;touch-action:none}
canvas{display:block;width:100%;height:100%;touch-action:none}.status{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:30px;color:#617B68;font-size:15px;line-height:1.7;pointer-events:none}.status.hidden{display:none}
.footer{font-size:13px;color:#8B9A90;text-align:center;padding-top:15px;line-height:1.7}.note{color:#B27865;font-size:12px}
</style>
<script type="importmap">{"imports":{"three":"/admin/vendor/three.module.min.js"}}</script>
</head><body>
<div class="shell"><div class="header"><strong>我的立体白模</strong><span>旋转 · 缩放</span></div>
<div class="stage" id="stage"><div class="status" id="status">正在加载 GLB 模型…</div></div>
<div class="footer">单指拖动旋转 · 双指捏合缩放<br><span class="note">预览的是造型，实物采用白色 PLA 打印。</span></div></div>
<script type="module">
import * as THREE from '../vendor/three.module.min.js';
import {GLTFLoader} from '../vendor/loaders/GLTFLoader.js';
const stage=document.getElementById('stage'),status=document.getElementById('status');
let renderer,scene,camera,orbitRoot,dragging=false,lastX=0,lastY=0,pinchDist=0,touches=0,scheduled=false;
const showError=s=>{status.classList.remove('hidden');status.textContent=s};
function paint(){if(!renderer||scheduled)return;scheduled=true;requestAnimationFrame(()=>{scheduled=false;renderer.render(scene,camera)})}
function zoom(r){camera.zoom=Math.max(.5,Math.min(4,camera.zoom*r));camera.updateProjectionMatrix();paint()}
function distance(t){return Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY)}
function bindEvents(canvas){
 canvas.addEventListener('pointerdown',e=>{dragging=true;lastX=e.clientX;lastY=e.clientY;canvas.setPointerCapture(e.pointerId)});
 canvas.addEventListener('pointermove',e=>{
  if(!dragging||touches>1)return;
  orbitRoot.rotation.y+=(e.clientX-lastX)*.012;
  orbitRoot.rotation.x=Math.max(-.6,Math.min(.6,orbitRoot.rotation.x+(e.clientY-lastY)*.008));
  lastX=e.clientX;lastY=e.clientY;paint()
 });
 canvas.addEventListener('pointerup',()=>dragging=false);
 canvas.addEventListener('pointercancel',()=>dragging=false);
 canvas.addEventListener('wheel',e=>{e.preventDefault();zoom(e.deltaY>0?.91:1.09)},{passive:false});
 canvas.addEventListener('touchstart',e=>{touches=e.touches.length;if(touches>=2)pinchDist=distance(e.touches)},{passive:false});
 canvas.addEventListener('touchmove',e=>{touches=e.touches.length;if(touches>=2){e.preventDefault();const d=distance(e.touches);if(pinchDist)zoom(d/pinchDist);pinchDist=d}},{passive:false});
 canvas.addEventListener('touchend',e=>{touches=e.touches.length;if(touches<2)pinchDist=0},{passive:false});
}
function resize(){
 if(!renderer)return;
 const w=stage.clientWidth,h=stage.clientHeight;
 if(!w||!h)return;
 renderer.setSize(w,h,false);
 const half=1,aspect=w/h;
 camera.left=-half*aspect;camera.right=half*aspect;camera.top=half;camera.bottom=-half;camera.updateProjectionMatrix();paint();
}
async function start(){
 const raw=new URLSearchParams(location.search).get('model');
 if(!raw)throw Error('缺少模型地址');
 const url=new URL(raw,location.href);
 if(url.origin!==location.origin||!url.pathname.startsWith('/media/')||!url.searchParams.has('signature'))throw Error('模型链接无效或已失效');
 const res=await fetch(url.href);
 if(!res.ok)throw Error('模型下载失败：HTTP '+res.status);
 const bytes=await res.arrayBuffer();
 if(bytes.byteLength<12||new DataView(bytes).getUint32(0,true)!==0x46546c67)throw Error('不是有效的 GLB 文件');
 const gltf=await new Promise((ok,fail)=>new GLTFLoader().parse(bytes,'',ok,fail));
 const root=gltf.scene;root.updateMatrixWorld(true);
 const box=new THREE.Box3().setFromObject(root),center=box.getCenter(new THREE.Vector3()),size=box.getSize(new THREE.Vector3());
 const max=Math.max(size.x,size.y,size.z);if(!Number.isFinite(max)||max<.00001)throw Error('GLB 没有可见的几何体');
 const white=new THREE.MeshStandardMaterial({color:0xf5f5f2,roughness:.88,metalness:0,side:THREE.DoubleSide});
 let meshes=0;root.traverse(n=>{if(n.isMesh){n.material=white;meshes++}});if(!meshes)throw Error('GLB 不包含网格');
 scene=new THREE.Scene();scene.background=new THREE.Color('#EAF0E9');
 const centered=new THREE.Group();centered.add(root);centered.scale.setScalar(1/max);centered.position.copy(center).multiplyScalar(-1/max);
 orbitRoot=new THREE.Group();orbitRoot.add(centered);scene.add(orbitRoot);
 scene.add(new THREE.HemisphereLight(0xffffff,0x9ca99f,2.8));
 const key=new THREE.DirectionalLight(0xffffff,3.1);key.position.set(4,5,6);scene.add(key);
 camera=new THREE.OrthographicCamera(-1,1,1,-1,.01,50);camera.position.set(0,.35,3);camera.lookAt(0,0,0);
 renderer=new THREE.WebGLRenderer({antialias:true});
 renderer.setPixelRatio(Math.min(2,window.devicePixelRatio||1));renderer.outputColorSpace=THREE.SRGBColorSpace;
 renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.5;
 stage.appendChild(renderer.domElement);bindEvents(renderer.domElement);resize();
 new ResizeObserver(resize).observe(stage);status.classList.add('hidden');paint();
}
start().catch(e=>{console.error('童印GLB渲染失败',e);showError('3D预览失败：'+e.message+'。请返回小程序使用备用图片，或稍后重试。')});
</script></body></html>
