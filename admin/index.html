<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>童印 · 管理后台</title>
<style>
:root{color-scheme:light;font-family:system-ui,'Microsoft Yahei',sans-serif}*{box-sizing:border-box}body{background:#f7f3ef;color:#342f2b;margin:0}header{background:#fff;padding:20px 5%;display:flex;justify-content:space-between;gap:18px;align-items:center;border-bottom:1px solid #e9e2dc}h1{margin:0;font-size:21px}main{max-width:1100px;margin:30px auto;padding:0 20px}.panel{background:#fff;border-radius:18px;padding:22px;margin:20px 0;border:1px solid #ece5e0}.card{border:1px solid #eee5df;border-radius:14px;padding:17px;margin:12px 0}.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}.grow{flex:1}button{border:0;border-radius:9px;background:#ed805c;padding:10px 16px;color:white;cursor:pointer}button.secondary{color:#8f5643;background:#ffede5}input,select{padding:9px;border:1px solid #dcd2cb;border-radius:8px;max-width:100%}img{height:95px;width:95px;object-fit:contain;background:#f8f4f1;border-radius:10px}small,.muted{color:#877c73}.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.status{display:inline-block;background:#fff0e6;border-radius:18px;padding:4px 10px;color:#ab684a}.hidden{display:none}pre{white-space:pre-wrap;word-wrap:break-word}h2{font-size:19px}a{color:#af684a}#msg{font-size:13px;color:#ad5738}
</style></head>
<body>
<header><h1>童印 <small>运营后台</small></h1><div class="row"><input id="token" type="password" placeholder="管理员口令" style="width:230px"><button onclick="login()">进入后台</button><button class="secondary" onclick="logout()">退出</button></div></header>
<main><p id="msg">请输入 ADMIN_TOKEN 后查看作品与订单。</p>
<section class="panel"><div class="row"><h2 class="grow">待处理作品</h2><button class="secondary" onclick="refresh()">刷新</button></div><div id="works"></div></section>
<section class="panel"><h2>订单管理</h2><div id="orders"></div></section>
</main>
<script>
let auth=sessionStorage.getItem('tongyin_admin')||'';document.getElementById('token').value=auth;
const h=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const msg=s=>document.getElementById('msg').textContent=s;
async function api(path,opts={}){const res=await fetch(path,{...opts,headers:{'X-Admin-Token':auth,...(opts.headers||{})}});let v=await res.json().catch(()=>({error:'返回格式不正确'}));if(!res.ok)throw Error(v.error||res.status);return v}
function login(){auth=document.getElementById('token').value.trim();sessionStorage.setItem('tongyin_admin',auth);refresh()}
function logout(){auth='';sessionStorage.removeItem('tongyin_admin');document.getElementById('token').value='';document.getElementById('works').innerHTML='';document.getElementById('orders').innerHTML='';msg('已退出')}
function imgs(urls){return (urls||[]).map(u=>`<a href="${h(u)}" target="_blank" rel="noreferrer"><img src="${h(u)}"></a>`).join('')}
async function refresh(){try{const [works,orders]=await Promise.all([api('/api/admin/works'),api('/api/admin/orders')]);msg('已更新 · '+new Date().toLocaleTimeString());
  works.sort((a,b)=>b.created_at.localeCompare(a.created_at));orders.sort((a,b)=>b.created_at.localeCompare(a.created_at));
  document.getElementById('works').innerHTML=works.length?works.map(w=>`<div class="card"><div class="row"><strong>${h(w.id.slice(0,10))}</strong><span class="status">${h(w.status)}</span><small>${h(w.created_at)}</small></div><div class="thumbs">${imgs([w.original])}${imgs(w.candidates)}${imgs(w.preview)}</div><small>原画 | 候选图 ${w.candidates.length}/2 | 预览图 ${w.preview.length}/4 | 已选 ${w.selected+1}</small><div class="row" style="margin-top:14px"><select id="kind_${w.id}"><option value="candidate">上传候选图</option><option value="preview">上传白模预览图</option><option value="model">上传3D模型(GLB)</option></select><input type="file" id="file_${w.id}" accept=".jpg,.jpeg,.png,.webp,.glb"><button onclick="upload('${w.id}')">上传文件</button>${w.model?`<a href="${h(w.model)}" target="_blank">下载模型</a>`:''}</div><div class="row" style="margin-top:8px"><input id="note_${w.id}" placeholder="失败原因/备注"><button class="secondary" onclick="changeWork('${w.id}','failed')">标记失败</button><button class="secondary" onclick="changeWork('${w.id}','image_pending')">重新候选图阶段</button></div></div>`).join(''):'暂无作品';
  document.getElementById('orders').innerHTML=orders.length?orders.map(o=>`<div class="card"><div class="row"><strong>#${h(o.id.slice(0,10))}</strong><span class="status">${h(o.status)}</span><span class="grow">¥${(o.price_fen/100).toFixed(2)}</span><small>${h(o.created_at)}</small></div><p>${h(o.name)} · ${h(o.phone)}<br>${h(o.address)}</p><small>关联作品：${h(o.work_id)}</small><div class="row" style="margin-top:12px"><select id="order_${o.id}"><option value="printing">制作中</option><option value="shipped">已发货</option><option value="completed">已完成</option><option value="canceled">取消</option></select><input id="tracking_${o.id}" placeholder="快递单号" value="${h(o.tracking||'')}"><button onclick="changeOrder('${o.id}')">更新订单</button></div></div>`).join(''):'暂无订单';
}catch(e){msg('加载失败：'+e.message)}}
async function upload(id){const inp=document.getElementById('file_'+id),kind=document.getElementById('kind_'+id).value;if(!inp.files.length){alert('请选择文件');return}const form=new FormData();form.append('file',inp.files[0]);try{await api('/api/admin/works/'+id+'/asset?kind='+kind,{method:'POST',body:form});await refresh()}catch(e){alert(e.message)}}
async function changeWork(id,status){try{await api('/api/admin/works/'+id+'/status',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({Status:status,Note:document.getElementById('note_'+id).value})});refresh()}catch(e){alert(e.message)}}
async function changeOrder(id){try{await api('/api/admin/orders/'+id+'/status',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({Status:document.getElementById('order_'+id).value,Tracking:document.getElementById('tracking_'+id).value})});refresh()}catch(e){alert(e.message)}}
if(auth)refresh();
</script></body></html>
