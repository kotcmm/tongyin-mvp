<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <title>童印 · 运营管理中心</title>
    <link rel="stylesheet" href="/admin/app.css" />
  </head>
  <body>
    <div id="loginWrap">
      <form class="login" onsubmit="event.preventDefault();login()">
        <div class="logo">童</div>
        <h1>童印运营中心</h1>
        <p class="muted">登录后管理用户、画作、模型、订单与物流。</p>
        <input id="username" autocomplete="username" placeholder="管理员账号" value="admin" />
        <input
          id="password"
          type="password"
          autocomplete="current-password"
          placeholder="登录密码"
        />
        <button type="submit" id="loginSubmit">登录管理后台</button>
        <div class="muted small" id="loginError"></div>
        <p class="small muted" style="margin: 15px 0 0">
          第一次部署：在后端 .env 设置 ADMIN_BOOTSTRAP_USER 和 ADMIN_BOOTSTRAP_PASSWORD，然后重启 Go
          服务。
        </p>
        <details style="margin-top: 18px">
          <summary class="muted small">旧版后台应急密钥登录</summary>
          <input
            id="legacy"
            type="password"
            autocomplete="off"
            placeholder="ADMIN_TOKEN（过渡用途）"
          />
          <button type="button" class="ghost" onclick="legacyLogin()">使用应急密钥</button>
        </details>
      </form>
    </div>
    <div id="app" class="hidden">
      <aside>
        <div class="brand">
          <strong>童印<span style="color: #e58160">.</span></strong
          ><small>单体业务运营中心</small>
        </div>
        <div id="nav"></div>
        <div class="account">
          <div id="accountName"></div>
          <div class="row" style="margin-top: 12px">
            <button class="ghost" onclick="logout()">退出登录</button>
          </div>
        </div>
      </aside>
      <section class="content">
        <div class="topline">
          <div>
            <h1 id="pageTitle">运营概览</h1>
            <p id="pageIntro">用户、作品、订单和物流集中管理</p>
          </div>
          <div class="row">
            <button class="ghost" onclick="loadTab()">刷新当前数据 ↻</button
            ><span class="muted small" id="lastLoaded"></span>
          </div>
        </div>
        <div id="body"></div>
      </section>
    </div>
    <div id="modalContainer"></div>
    <div id="toast" class="toast hidden"></div>
    <!-- 按职责加载控制台：基础状态 → 视图 → 操作，无需额外 Node 服务。 -->
    <script src="/admin/core.js"></script>
    <script src="/admin/views.js"></script>
    <script src="/admin/actions.js"></script>
  </body>
</html>
