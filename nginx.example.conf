# 放在已有的 HTTPS server {} 中；证书/TLS 沿用现有站点配置。
# 将 api.example.com 解析到服务器，并为其启用有效 HTTPS 证书。
server {
    listen 80;
    server_name api.example.com;
    # 正式部署请由现有 Nginx HTTPS 配置接管；禁止明文传输小程序用户请求。
    return 301 https://$host$request_uri;
}
